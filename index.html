<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Autostart Test</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:#0b1020;
      color:#e5e7eb;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    header{
      padding:14px 16px;
      background:#111827;
      position:sticky; top:0; z-index:5;
      box-shadow:0 2px 10px rgba(0,0,0,.35);
    }
    header h1{ margin:0; font-size:18px; font-weight:700; }
    header p{ margin:6px 0 0; font-size:13px; color:#9ca3af; }

    main{ padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; }
    .card{
      width:min(900px, 100%);
      background:#0f172a;
      border:1px solid #1f2937;
      border-radius:16px;
      padding:14px;
      box-shadow:0 4px 18px rgba(0,0,0,.35);
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      padding:8px 10px;
      border-radius:999px;
      background:#111827;
      border:1px solid #1f2937;
      color:#e5e7eb;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background:#6b7280;
      box-shadow:0 0 0 2px rgba(255,255,255,.06) inset;
    }
    .status.loading .dot{ background:#fbbf24; }
    .status.live .dot{ background:#10b981; }
    .status.error .dot{ background:#ef4444; }

    video{
      width:100%;
      max-height:70vh;
      border-radius:12px;
      background:black;
      transform: scaleX(-1); /* selfie mirror */
    }

    .row{ display:flex; gap:8px; flex-wrap:wrap; }
    button{
      appearance:none; border:0;
      background:#2563eb; color:white; font-weight:700;
      padding:10px 14px; border-radius:12px; cursor:pointer;
    }
    button.secondary{ background:#374151; }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    small{ color:#9ca3af; }

    footer{
      margin-top:auto;
      padding:10px 16px;
      font-size:12px;
      color:#9ca3af;
      text-align:center;
    }
    code{ background:#111827; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <header>
    <h1>Camera Autostart Test</h1>
    <p>הדף הזה פותח מצלמה מיד בכניסה (אם הדפדפן מרשה). אם לא — כפתור “Start Camera” יופיע.</p>
  </header>

  <main>
    <div class="card">
      <div id="status" class="status loading" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Starting camera…</span>
      </div>
      <div style="height:12px"></div>
      <video id="video" autoplay playsinline muted></video>

      <div style="height:12px"></div>
      <div class="row">
        <button id="startBtn" style="display:none">Start Camera</button>
        <button id="stopBtn" class="secondary" disabled>Stop Camera</button>
        <button id="retryBtn" class="secondary" style="display:none">Retry</button>
      </div>
      <div style="height:6px"></div>
      <small id="hint"></small>
    </div>
  </main>

  <footer>
    עובד רק ב־HTTPS (או localhost). GitHub Pages זה מצוין. ב־iOS/Safari ייתכן שתצטרך ללחוץ Start פעם ראשונה.
  </footer>

<script>
(() => {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const retryBtn = document.getElementById('retryBtn');
  const hint = document.getElementById('hint');

  let stream = null;

  function setStatus(text, kind){
    statusText.textContent = text;
    statusEl.classList.remove('loading','live','error');
    if(kind) statusEl.classList.add(kind);
  }

  async function openCamera(){
    try{
      setStatus('Requesting permission…','loading');
      hint.textContent = '';
      startBtn.style.display = 'none';
      retryBtn.style.display = 'none';

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      video.srcObject = stream;
      await video.play().catch(()=>{});
      stopBtn.disabled = false;
      setStatus('Live stream ON','live');
    }catch(err){
      console.warn(err);
      stream = null;
      stopBtn.disabled = true;
      setStatus('Permission denied / camera unavailable','error');
      retryBtn.style.display = 'inline-block';
      startBtn.style.display = 'inline-block';
      hint.textContent = (
        location.protocol !== 'https:' && location.hostname !== 'localhost'
          ? 'צריך HTTPS כדי לפתוח מצלמה. העלה ל־GitHub Pages.'
          : 'הדפדפן חסם פתיחה אוטומטית. לחץ Start Camera.'
      );
    }
  }

  function closeCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
    stopBtn.disabled = true;
    setStatus('Camera closed','loading');
  }

  startBtn.addEventListener('click', openCamera);
  retryBtn.addEventListener('click', openCamera);
  stopBtn.addEventListener('click', closeCamera);

  // auto-start on load
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('Camera API not supported','error');
    hint.textContent = 'הדפדפן לא תומך ב־getUserMedia.';
    startBtn.style.display = 'none';
  } else {
    openCamera();
  }
})();
</script>
</body>
</html>
