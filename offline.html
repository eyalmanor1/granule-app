<!doctype html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e1e2e" />
  <title>Offline</title>
  <style>
    body{margin:0;background:#121212;color:#b3b3ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{max-width:520px;background:#1a1a22;border:1px solid rgba(179,179,255,.18);border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 16px;line-height:1.5;color:#d6d6ff}
    button{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#b3b3ff;color:#121212;font-weight:700;cursor:pointer}
    button:active{transform:translateY(1px)}
    small{display:block;margin-top:16px;color:#9a9ab8}
  </style>
</head>
<body>
  <div class="card">
    <h1>אין חיבור לאינטרנט</h1>
    <p>היישום מותקן ויכול לעבוד חלקית גם במצב אופליין. נסה/י להתחבר שוב ואז לרענן.</p>
    <button onclick="location.reload()">רענון</button>
    <small>Tip: אם זו ההפעלה הראשונה — פתח/י את האתר פעם אחת עם אינטרנט כדי שיישמר מטמון.</small>
  </div>
</body>
</html>
